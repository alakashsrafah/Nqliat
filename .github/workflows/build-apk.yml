name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  NODE_OPTIONS: '--no-deprecation'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m'"

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (LTS Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React/Vite Web App
        run: npm run build

      - name: Add & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi
          echo "Syncing Capacitor Android platform..."
          npx cap sync android

      - name: Configure Android Permissions & Cleartext Traffic (Stations Pattern)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Configuring AndroidManifest.xml for full compatibility..."
            
            # Ensure Storage and Network Permissions
            PERMISSIONS_TO_ADD=""
            
            if ! grep -q "INTERNET" "$MANIFEST"; then
              PERMISSIONS_TO_ADD="$PERMISSIONS_TO_ADD\n    <uses-permission android:name=\"android.permission.INTERNET\" />"
            fi
            if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
              PERMISSIONS_TO_ADD="$PERMISSIONS_TO_ADD\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />"
            fi
            if ! grep -q "ACCESS_WIFI_STATE" "$MANIFEST"; then
              PERMISSIONS_TO_ADD="$PERMISSIONS_TO_ADD\n    <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />"
            fi
            if ! grep -q "READ_EXTERNAL_STORAGE" "$MANIFEST"; then
              PERMISSIONS_TO_ADD="$PERMISSIONS_TO_ADD\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />"
            fi
            if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              PERMISSIONS_TO_ADD="$PERMISSIONS_TO_ADD\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />"
            fi
            if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MANIFEST"; then
              PERMISSIONS_TO_ADD="$PERMISSIONS_TO_ADD\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />"
            fi
            if ! grep -q "CAMERA" "$MANIFEST"; then
              PERMISSIONS_TO_ADD="$PERMISSIONS_TO_ADD\n    <uses-permission android:name=\"android.permission.CAMERA\" />"
            fi

            if [ -n "$PERMISSIONS_TO_ADD" ]; then
              sed -i "/<\/manifest>/i $PERMISSIONS_TO_ADD" "$MANIFEST"
              echo "Added required permissions to AndroidManifest.xml"
            fi

            # Enable cleartext traffic (HTTP for LAN servers) and legacy external storage inside <application>
            if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application /<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true" /g' "$MANIFEST"
              echo "Enabled usesCleartextTraffic and requestLegacyExternalStorage in AndroidManifest.xml"
            fi
          fi

          # Ensure Gradle properties have sufficient memory and jetifier enabled
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            if ! grep -q "org.gradle.jvmargs" "$GRADLE_PROPS"; then
              echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> "$GRADLE_PROPS"
            fi
            if ! grep -q "android.useAndroidX" "$GRADLE_PROPS"; then
              echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
            fi
            if ! grep -q "android.enableJetifier" "$GRADLE_PROPS"; then
              echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android
          cache-disabled: true

      - name: Make Gradlew Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare and Verify APK Outputs
        run: |
          APK_RAW="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_RAW" ]; then
            mkdir -p release-output
            cp "$APK_RAW" "release-output/nkliat-transport-app-debug.apk"
            cp "$APK_RAW" "release-output/app-debug.apk"
            
            APK_SIZE=$(du -h "release-output/nkliat-transport-app-debug.apk" | cut -f1)
            APK_SHA=$(sha256sum "release-output/nkliat-transport-app-debug.apk" | cut -d' ' -f1)
            
            echo "### 📱 تفاصيل بناء تطبيق أندرويد (APK Build Summary)" >> $GITHUB_STEP_SUMMARY
            echo "- **اسم ملف التطبيق:** \`nkliat-transport-app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **حجم الحزمة:** \`$APK_SIZE\`" >> $GITHUB_STEP_SUMMARY
            echo "- **البصمة الرقمية (SHA-256):** \`$APK_SHA\`" >> $GITHUB_STEP_SUMMARY
            echo "- **دعم الشبكة المحلية (LAN):** تم تفعيل Cleartext Traffic للاتصال المباشر بالسيرفر من أي هاتف" >> $GITHUB_STEP_SUMMARY
            echo "- **دعم التخزين المحلي:** تم منح أذونات حفظ ملفات SQLite داخل \`Documents/nkliat\`" >> $GITHUB_STEP_SUMMARY
            echo "- **تسجيل الدخول الإلزامي:** مفعل مسبقاً لحماية بيانات الشركة عبر الشبكة" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: APK file not found at $APK_RAW"
            exit 1
          fi

      - name: Upload APK Artifact (With Quota Protection)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nkliat-transport-app-debug-apk
          path: release-output/*.apk
          retention-days: 7

      - name: Publish APK to GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: latest-apk-build
          name: نظام إدارة شركة النقل البري - أحدث نسخة أندرويد APK
          body: |
            ### 🚛 نظام إدارة شركة النقل البري - نسخة أندرويد APK المحدثة
            - **تاريخ البناء:** ${{ github.event.head_commit.timestamp || 'Latest Build' }}
            - **كود الالتزام (Commit):** ${{ github.sha }}
            - **المميزات المضمنة في هذه النسخة:**
              1. 🔐 **تسجيل الدخول الإلزامي:** حماية الجلسة وإلزام تسجيل الدخول لكافة مستخدمي وأجهزة الشبكة.
              2. 📝 **تحديث نماذج السندات المالية:** تباين ألوان عالي ومثالي للقراءة باللغتين العربية والإنجليزية في سندات القبض، الصرف، والقيود اليومية.
              3. 💾 **قاعدة بيانات مطورة ومتوافقة:** دمج الترقيم التلقائي وتحديث المستخدمين وحفظ النسخ الاحتياطي بتنسيق SQLite Native في مجلد الهاتف الرسمي `Documents/nkliat`.
              4. 🌐 **جاهزية العمل على الشبكة المحلية (LAN):** تفعيل Cleartext Traffic للربط عبر IP المحلي بدون قيود أمنية.
          draft: false
          prerelease: false
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
